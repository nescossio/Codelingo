<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dúvidas - Codelingo</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header>
    <h1><i class="fas fa-question-circle"></i> Central de Dúvidas</h1>
    <p>Estamos aqui para ajudar você na sua jornada de aprendizado.</p>
</header>

<nav>
    <a href="/">Início</a>
    <a href="/aulas">Aulas</a>
    <a href="/exercicios">Exercícios</a>
    <a href="/duvidas" class="active">Dúvidas</a>
</nav>

<div class="container">
    <h2><i class="fas fa-paper-plane"></i> Envie sua dúvida</h2>
    <p>Teve dificuldade em algum exercício ou conceito? Descreva abaixo e nossa equipe entrará em contato.</p>
    
    <form method="POST" style="margin-top: 20px;">
        <textarea name="duvida" placeholder="Descreva sua dúvida detalhadamente aqui..." required></textarea>
        <div style="margin-top: 20px;">
            <button type="submit"><i class="fas fa-send"></i> Enviar Pergunta</button>
        </div>
    </form>
</div>

<footer>
    Codelingo – Educação e Tecnologia
</footer>

</body>
</html>
